<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E8">
<title>SERAFINA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
@font-face { font-family: Ortica; src: url(fonts/OrticaLinear-Light.woff2); font-weight: 300; }
@font-face { font-family: Ortica; src: url(fonts/OrticaLinear-Regular.woff2); font-weight: 400; }
@font-face { font-family: Hedvig; src: url(fonts/HedvigLettersSans-Regular.otf); }
:root {
  --salvia: #36433A; --salvia2: #4A5A4C; --salvia3: #6F8270; --lino: #F4F0E8; --lino2: #EBE6DC; --sage: #C9D1C3;
  --papel: #FBF9F5; --alerta: #9A4B2F; --alerta-bg: #F3E3DA;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --sombra: 0 18px 40px -18px rgba(54, 67, 58, .22);
  --borde: 1px solid rgba(54, 67, 58, .09);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--lino); }
body { margin: 0; min-height: 100dvh; color: var(--salvia); font: 18px/1.45 Hedvig, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: Ortica, serif; font-weight: 300; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 34px; line-height: 1.05; } h2 { font-size: 24px; } h3 { font-size: 20px; font-weight: 400; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.num { font-family: Hedvig, sans-serif; letter-spacing: -.02em; }
.muted { color: var(--salvia3); } .small { font-size: 15px; } .warn { color: var(--alerta); }

/* ---- Estructura: riel a la izquierda en tablet, barra abajo en pantallas angostas ---- */
.shell { display: grid; grid-template-columns: 112px 1fr; min-height: 100dvh; }
nav.rail { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 12px; border-right: var(--borde); background: var(--papel); }
nav.rail .mark { font-family: Ortica, serif; font-size: 26px; margin-bottom: 26px; }
nav.rail button { width: 88px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; border-radius: 22px; background: transparent; color: var(--salvia2); }
nav.rail button.on { background: var(--salvia); color: var(--lino); }
main { padding: 34px clamp(20px, 4vw, 56px) 60px; max-width: 1240px; width: 100%; }
.pagehead { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px; margin-bottom: 26px; }
.pagehead p { margin: 8px 0 0; max-width: 56ch; }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  nav.rail { position: fixed; inset: auto 0 0 0; top: auto; height: auto; flex-direction: row; justify-content: space-around; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); border-right: 0; border-top: var(--borde); z-index: 5; }
  nav.rail .mark { display: none; }
  nav.rail button { width: auto; flex: 1; min-height: 66px; }
  main { padding-bottom: 120px; }
  .pagehead { grid-template-columns: 1fr; }
}

/* ---- Superficies ---- */
.surface { background: var(--papel); border: var(--borde); border-radius: 28px; box-shadow: var(--sombra); }
.pad { padding: 26px 28px; }
.list > * + * { border-top: var(--borde); }
.label { font-size: 14px; color: var(--salvia3); text-transform: uppercase; letter-spacing: .08em; }

/* ---- Controles ---- */
button { font: inherit; color: inherit; border: 0; cursor: pointer; border-radius: 18px; min-height: 56px; padding: 0 22px; background: var(--lino2); display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .25s var(--ease), background .25s var(--ease), color .25s var(--ease); }
button:active { transform: scale(.97); }
button.primary { background: var(--salvia); color: var(--lino); }
button.quiet { background: transparent; border: 1px solid rgba(54, 67, 58, .18); }
button.block { width: 100%; min-height: 64px; font-size: 19px; }
button[disabled] { opacity: .45; }
button.icon { width: 56px; padding: 0; border-radius: 50%; }
.field { display: grid; gap: 8px; margin-top: 18px; }
.field > span:first-child { font-size: 16px; color: var(--salvia2); }
.field small { font-size: 14px; color: var(--salvia3); }
.field small.err { color: var(--alerta); }
input { font: inherit; font-size: 21px; color: var(--salvia); background: #fff; border: 1.5px solid rgba(54, 67, 58, .16); border-radius: 18px; padding: 0 18px; min-height: 60px; width: 100%; transition: border-color .2s; }
input:focus { outline: none; border-color: var(--salvia); }
input.bad { border-color: var(--alerta); }
input[type=checkbox] { width: 22px; height: 22px; min-height: 0; padding: 0; flex: none; accent-color: var(--salvia); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--lino2); border-radius: 20px; padding: 5px; gap: 5px; }
.seg button { background: transparent; min-height: 52px; padding: 0 10px; }
.seg button.on { background: var(--papel); box-shadow: 0 4px 14px -6px rgba(54, 67, 58, .3); }
.stepper { display: inline-flex; align-items: center; gap: 6px; background: var(--lino2); border-radius: 99px; padding: 4px; }
.stepper button { width: 50px; min-height: 50px; padding: 0; border-radius: 50%; background: var(--papel); }
.stepper b { min-width: 70px; text-align: center; font-size: 20px; font-weight: 400; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 5px 12px; border-radius: 99px; background: var(--lino2); white-space: nowrap; }
.pill.ok { background: var(--sage); } .pill.warn { background: var(--alerta-bg); color: var(--alerta); }
.pill svg.i { width: 16px; height: 16px; }

/* ---- Inicio (bento) ---- */
.bento { display: grid; grid-template-columns: 1.35fr 1fr; grid-template-rows: auto auto; gap: 18px; }
.hero { grid-row: span 2; background: var(--salvia); color: var(--lino); border-radius: 32px; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; min-height: 300px; box-shadow: 0 30px 60px -30px rgba(54, 67, 58, .6); }
.hero .label { color: var(--sage); }
.hero .monto { font-size: clamp(54px, 7vw, 84px); line-height: 1; letter-spacing: -.04em; margin-top: 10px; }
.hero .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; border-top: 1px solid rgba(244, 240, 232, .16); padding-top: 18px; }
.tile { padding: 24px 26px; display: grid; gap: 6px; align-content: space-between; }
.tile .monto { font-size: 42px; line-height: 1; letter-spacing: -.03em; }
.tile.tap { cursor: pointer; transition: transform .3s var(--ease); } .tile.tap:active { transform: scale(.98); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--salvia3); display: inline-block; animation: respira 2.6s ease-in-out infinite; }
@keyframes respira { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
.two { display: grid; grid-template-columns: 1.7fr 1fr; gap: 18px; margin-top: 18px; align-items: start; }
.rank { padding: 14px 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; cursor: pointer; }
.rank .bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--lino2); overflow: hidden; }
.rank .bar i { display: block; height: 100%; border-radius: 99px; background: var(--salvia3); transform-origin: left; animation: crece 1s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms + 200ms); }
@keyframes crece { from { transform: scaleX(0); } }
.aviso { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 14px 0; align-items: start; cursor: pointer; }
.aviso svg.i { color: var(--alerta); margin-top: 2px; }
@media (max-width: 980px) { .bento, .two { grid-template-columns: 1fr; } .hero { grid-row: auto; } }

/* ---- Filas de listas ---- */
.row { display: grid; align-items: center; gap: 14px; padding: 16px 22px; }
.row.tap { cursor: pointer; transition: background .2s; } .row.tap:active { background: var(--lino2); }
.prow { grid-template-columns: 1.3fr repeat(4, minmax(96px, .6fr)) 28px; }
/* Venta física: tono arena, distinto del salvia pero de la misma familia cálida */
.fisico { background: #ECE3D3; color: #4A3F30; border-radius: 14px; padding: 8px 12px; margin: -8px 0; }
.may { background: #ECE3D3; color: #4A3F30; border-radius: 18px; padding: 14px 16px; display: grid; gap: 4px; }
.tline s { color: var(--salvia3); font-size: 13px; }
.receipt tfoot tr.sub td { font-size: 15px; padding-top: 8px; color: var(--salvia2); }
.thead .fisico { background: transparent; color: #8A7658; padding: 0 12px; margin: 0; }
.prow .r { text-align: right; }
.thead { font-size: 13px; color: var(--salvia3); text-transform: uppercase; letter-spacing: .08em; padding-top: 18px; padding-bottom: 10px; }
.qrow { grid-template-columns: 1.3fr auto auto; }
.irow { grid-template-columns: 1fr auto 28px; }
@media (max-width: 820px) { .prow { grid-template-columns: 1fr auto 28px; } .prow .hide-s { display: none; } }

/* ---- Armar cotización: productos a la izquierda, ticket fijo a la derecha ---- */
.builder { display: grid; grid-template-columns: 1.5fr 1fr; gap: 22px; align-items: start; }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.picker button { min-height: 96px; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px 18px; background: var(--papel); border: var(--borde); border-radius: 22px; text-align: left; }
.picker button.in { border-color: var(--salvia); box-shadow: inset 0 0 0 1px var(--salvia); }
.picker button .q { align-self: flex-end; font-size: 14px; }
.ticket { position: sticky; top: 24px; }
.tline { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 14px 0; align-items: center; }
.total { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--salvia); color: var(--lino); border-radius: 22px; padding: 18px 20px; margin-top: 16px; }
.total .label { color: var(--sage); } .total .num { font-size: 30px; }
@media (max-width: 980px) { .builder { grid-template-columns: 1fr; } .ticket { position: static; } }

/* ---- Panel lateral ---- */
.veil { position: fixed; inset: 0; background: rgba(54, 67, 58, .28); z-index: 10; animation: fade .35s var(--ease); }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); background: var(--lino); z-index: 11; overflow-y: auto; padding: 28px 30px 40px; box-shadow: -30px 0 60px -30px rgba(54, 67, 58, .4); animation: entra .5s var(--ease); }
.panel .phead { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; margin-bottom: 8px; }
@keyframes entra { from { transform: translateX(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--salvia); color: var(--lino); border-radius: 24px; padding: 20px 22px; margin: 10px 0 6px; }
.summary .label { color: var(--sage); } .summary .num { font-size: 32px; }
.ing { display: grid; grid-template-columns: 1fr 120px auto; gap: 12px; align-items: center; padding: 12px 0; }
.choose { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 14px; }
.choose button { min-height: 70px; background: var(--papel); border: var(--borde); justify-content: flex-start; text-align: left; padding: 12px 16px; font-size: 16px; }

/* ---- Comprobante ---- */
.receipt { background: #fff; border-radius: 8px; padding: 34px 32px; box-shadow: var(--sombra); font-size: 15px; margin-top: 10px; }
.receipt img { height: 17px; width: auto; flex: none; }
.receipt table { width: 100%; border-collapse: collapse; margin: 20px 0; }
.receipt td, .receipt th { padding: 10px 0; border-bottom: 1px solid var(--lino2); text-align: left; font-weight: 400; }
.receipt th { font-size: 12px; color: var(--salvia3); text-transform: uppercase; letter-spacing: .08em; }
.receipt td:last-child, .receipt th:last-child { text-align: right; }
.receipt tfoot td { border: 0; font-size: 20px; padding-top: 16px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.actions .wide { grid-column: 1 / -1; }

/* ---- Vacíos, isla de avisos, entradas ---- */
.empty { text-align: left; padding: 34px 28px; display: grid; gap: 10px; justify-items: start; }
.empty svg.i { width: 34px; height: 34px; color: var(--salvia3); }
.island { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 30; background: var(--salvia); color: var(--lino); border-radius: 99px; padding: 14px 24px; display: flex; gap: 10px; align-items: center; box-shadow: 0 18px 40px -16px rgba(54, 67, 58, .6); animation: isla .55s var(--ease); max-width: calc(100vw - 32px); }
@keyframes isla { from { transform: translateX(-50%) scale(.6); opacity: 0; } }
.anim > * { animation: sube .7s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes sube { from { opacity: 0; transform: translateY(12px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media print { body * { visibility: hidden; } .receipt, .receipt * { visibility: visible; } .receipt { position: absolute; inset: 0; box-shadow: none; } }
</style>

<body>
<div class="shell"><nav class="rail" id="rail"></nav><main id="app"></main></div>
<script src="jspdf.umd.min.js"></script>
<script src="datos.js"></script>
<script>
// ===== Datos: viven en la planilla de Google; la tablet guarda una copia por si se corta internet =====
const URL_PLANILLA = 'https://script.google.com/macros/s/AKfycby3Y3oU76wcyCD-vPyocg_nj6mgEkfKbNT8CBicfSJj2rqnC27KcCrraZ-HJIVsMiIgeg/exec';
const KEY = 'serafina-app-v1';
// La clave llega una sola vez en el link que manda Jorge (…/#k=CLAVE) y queda guardada en la tablet.
if (location.hash.startsWith('#k=')) { localStorage.setItem(KEY + '-clave', decodeURIComponent(location.hash.slice(3))); history.replaceState(null, '', location.pathname); }
const CLAVE = localStorage.getItem(KEY + '-clave');
let db, subido = '', reintento = null;
let tab = 'inicio';
let draft = null; // cotización que se está armando
let animar = true; // la cascada de entrada solo al cambiar de pestaña, no en cada toque

function save() { // se llama en cada render: solo sube si algo cambió
  const s = JSON.stringify(db);
  if (s === subido) return;
  localStorage.setItem(KEY, s);
  localStorage.setItem(KEY + '-sin-subir', '1');
  clearTimeout(reintento);
  reintento = setTimeout(subir, 1500);
}
async function subir() {
  const s = JSON.stringify(db);
  try {
    const r = await (await fetch(URL_PLANILLA, { method: 'POST', body: JSON.stringify({ k: CLAVE, writes: toSheet(db) }) })).json();
    if (!r.ok) throw new Error(r.error);
    if (s === JSON.stringify(db)) { subido = s; reintento = null; localStorage.removeItem(KEY + '-sin-subir'); }
    estado('');
  } catch {
    estado('Sin internet: tus cambios quedan en la tablet y los paso a la planilla cuando vuelva.');
    reintento = setTimeout(subir, 30000);
  }
}
async function bajar() {
  const r = await (await fetch(`${URL_PLANILLA}?k=${encodeURIComponent(CLAVE)}`)).json();
  if (r.error) throw new Error(r.error);
  db = fromSheet(r); subido = JSON.stringify(db);
  localStorage.setItem(KEY, subido);
}
function estado(msg) {
  document.getElementById('estado')?.remove();
  if (msg) document.body.append(h('div', { id: 'estado', class: 'aviso', role: 'status', style: 'position:fixed;bottom:16px;right:16px;z-index:25;max-width:420px;background:var(--lino)' }, icon('alerta'), h('span', { class: 'small' }, msg)));
}

const $m = (n) => '$' + Math.round(n).toLocaleString('es-AR');
const prod = (id) => db.productos.find((p) => p.id === id);
// Por transferencia todo sale con el descuento de Ajustes (10%), kits incluidos.
const precioPago = (p, pago = 'transfer') => pago === 'transfer' ? conDescuento(p.precio, db.ajustes.transferencia) : p.precio;
const teQueda = (p, pago = 'transfer') => precioPago(p, pago) - costo(p).valor - comision(precioPago(p, pago), pago);
const margen = (p, pago) => Math.round(teQueda(p, pago) / precioPago(p, pago) * 100);
// Venta física: precio de lista menos el descuento de Ajustes, redondeado a $100. Se cobra en mano, sin comisión.
const conDescuento = (precio, pct) => Math.round(precio * (1 - pct / 100) / 100) * 100;
const precioFisico = (p) => conDescuento(p.precio, db.ajustes.fisico);
// Mayorista: cuenta las velas sueltas del pedido (los kits no entran) y busca el escalón.
function escalon(items) {
  const velas = items.reduce((s, it) => s + (prod(it.id).tipo === 'vela' ? it.cant : 0), 0);
  const esc = [...db.ajustes.mayorista].sort((a, b) => a.desde - b.desde);
  return { velas, actual: esc.filter((e) => velas >= e.desde).pop(), siguiente: esc.find((e) => velas < e.desde) };
}
const quedaFisico = (p) => precioFisico(p) - costo(p).valor;

// Al guardar, la cotización se queda con los precios y costos de ese día.
function congelar(c) {
  const e = escalon(c.items);
  // Mayorista (si está tildado): las velas llevan el % del escalón pagando por transferencia o contado (reemplaza al 10%, no se suma).
  // El 10% por transferencia es opcional (casilla). Contado sin mayorista y tarjeta: precio de lista.
  const transf = c.pago === 'transfer' && c.descTransf ? db.ajustes.transferencia : 0;
  c.descuento = c.pago !== 'tarjeta' && c.mayorista && e.actual ? e.actual.pct : 0;
  c.items = c.items.map((it) => {
    const p = prod(it.id);
    const desc = p.tipo === 'vela' && c.descuento ? c.descuento : transf;
    return { ...it, nombre: p.nombre, lista: p.precio, precio: conDescuento(p.precio, desc), desc, costo: costo(p).valor };
  });
  const ahorro = (cond) => c.items.filter(cond).reduce((s, it) => s + (it.lista - it.precio) * it.cant, 0);
  const enKits = ahorro((it) => it.desc === transf && transf !== c.descuento);
  c.lineas = [
    c.descuento ? [`Descuento mayorista ${c.descuento}%${enKits ? ' (velas)' : ''}`, ahorro((it) => it.desc === c.descuento)] : null,
    enKits ? [`Descuento por transferencia ${transf}%${c.descuento ? ' (kits)' : ''}`, enKits] : null,
  ].filter(Boolean);
  c.total = c.items.reduce((s, it) => s + it.precio * it.cant, 0);
  c.subtotal = c.items.reduce((s, it) => s + it.lista * it.cant, 0);
  c.sena = c.descuento && e.velas >= db.ajustes.senaDesde ? Math.round(c.total / 2) : 0;
  c.ganancia = c.total - c.items.reduce((s, it) => s + it.costo * it.cant, 0) - comision(c.total, c.pago);
  return c;
}

// ===== Íconos (trazo 1,5) =====
const ICONOS = {
  inicio: '<path d="M3.5 10.5 12 4l8.5 6.5V20H15v-5.5H9V20H3.5z"/>',
  cotizar: '<path d="M6.5 3.5h11v17l-2.75-1.8L12 20.5l-2.75-1.8-2.75 1.8z"/><path d="M9.5 8h5M9.5 11.5h5M9.5 15h3"/>',
  productos: '<path d="M8.5 10h7v10.5h-7z"/><path d="M12 3.2c1.6 1.9 2.1 3 1.1 4.3-.7.9-2.6.8-2.6-.7 0-1.2.6-2.2 1.5-3.6zM12 7.8V10"/>',
  insumos: '<path d="M8.5 3.5h7v3h-7zM7 6.5h10l1 3v10.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V9.5z"/><path d="M6 12.5h12"/>',
  ajustes: '<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/>',
  formulas: '<path d="M9.5 3.5h5M10.5 3.5v6L5.2 18.6a1.3 1.3 0 0 0 1.1 1.9h11.4a1.3 1.3 0 0 0 1.1-1.9L13.5 9.5v-6"/><path d="M7.5 14.5h9"/>',
  mas: '<path d="M12 5v14M5 12h14"/>', menos: '<path d="M5 12h14"/>', cerrar: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  ok: '<path d="M5 12.5 10 17l9-10"/>', buscar: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  alerta: '<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4M12 16.8v.2"/>', flecha: '<path d="M9.5 6l6 6-6 6"/>',
  whatsapp: '<path d="M4.5 19.5l1.2-3.6A7.8 7.8 0 1 1 8.4 18.4z"/><path d="M9.2 9.3c.2 2.6 2.4 4.8 5.2 5.2l.9-1.3-1.7-.8-.8.8c-1-.4-1.8-1.2-2.2-2.2l.8-.8-.8-1.7z"/>',
  mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="M4 6.5l8 6 8-6"/>',

async function mandar(c) {

      fila('Comisión de Pago Nube', 'Solo si pagan con tarjeta. Se le suma IVA.', stepper(a.comision, (v) => { a.comision = v; save(); }, 0.1, (v) => v.toFixed(1) + '%')),
      fila('Descuento por transferencia', 'Opcional: se tilda en cada cotización. Todo el pedido, kits incluidos. Si llega a precio mayorista, las velas llevan ese en vez de este.', stepper(a.transferencia, (v) => { a.transferencia = v; save(); }, 1, (v) => v + '%')),
      fila('Descuento venta física', 'Ferias y en persona. Se resta del precio de lista.', stepper(a.fisico, (v) => { a.fisico = v; save(); }, 1, (v) => v + '%')),
      fila('Ganancia mínima', 'Te aviso si un producto deja menos.', stepper(a.objetivo, (v) => { a.objetivo = v; save(); }, 1, (v) => v + '%'))),
    h('div', { class: 'label', style: 'margin:30px 0 12px' }, 'Precio mayorista · solo transferencia o efectivo, sin kits · reemplaza al de transferencia'),
    h('div', { class: 'surface list' },
      a.mayorista.map((e, n) => h('div', { class: 'row', style: 'grid-template-columns:1fr auto auto' },
        h('h3', {}, `Escalón ${n + 1}`),
        h('div', {}, h('div', { class: 'muted small' }, 'Desde'), stepper(e.desde, (v) => { e.desde = v; save(); }, 1, (v) => `${v} velas`, 1)),
        h('div', {}, h('div', { class: 'muted small' }, 'Descuento'), stepper(e.pct, (v) => { e.pct = v; save(); }, 1, (v) => v + '%')))),
      fila('Seña del 50%', 'A partir de cuántas velas se pide seña.', stepper(a.senaDesde, (v) => { a.senaDesde = v; save(); }, 1, (v) => `${v} velas`, 1))),
  ];
}

const VIEWS = { inicio, cotizar, productos, insumos, formulas, ajustes };
function pantalla(titulo, texto) {
  document.getElementById('app').replaceChildren(h('div', { class: 'surface empty' }, icon('alerta'), h('h3', {}, titulo), h('p', { class: 'muted small', style: 'margin:0' }, texto)));
}
(async () => {
  if (!CLAVE) return pantalla('Falta la clave', 'Abrí la app desde el link que te mandó Jorge. Después ya queda guardada.');
  const copia = localStorage.getItem(KEY);
  // Si quedaron cambios sin pasar a la planilla, mandan los de la tablet.
  if (copia && localStorage.getItem(KEY + '-sin-subir')) { db = JSON.parse(copia); render(); return; }
  try { await bajar(); } catch {
    if (!copia) return pantalla('No pude abrir la planilla', 'Fijate que haya internet y volvé a abrir la app.');
    db = JSON.parse(copia); subido = copia;
    estado('Sin internet: estás viendo lo último que se guardó.');
  }
  render();
})();
// Al volver a la app, traer lo último de la planilla (por si Jorge cambió algo desde la PC).
// shortcut: si los dos editan lo mismo a la vez gana el último que guarda; alcanza para dos personas.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && db && !reintento && !draft && !document.querySelector('.panel')) bajar().then(render, () => {});
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
